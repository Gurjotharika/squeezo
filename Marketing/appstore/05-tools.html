<!doctype html><meta charset=utf-8><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"><style>
*{box-sizing:border-box;margin:0}
html,body{width:2880px;height:1800px;overflow:hidden;background:#F6F6F4;color:#111113}
body{font-family:'Instrument Sans',Helvetica,Arial,sans-serif;position:relative}
.eyebrow{position:absolute;top:96px;left:0;right:0;text-align:center;display:flex;justify-content:center}
.brand{display:inline-flex;align-items:center;gap:20px;font:800 44px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.mark{width:64px;height:64px;border-radius:18px;background:#141416;display:grid;place-items:center}
.mark svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{position:absolute;top:230px;left:0;right:0;text-align:center;font:800 170px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.028em;word-spacing:.08em;text-wrap:balance;padding:0 200px}
p.sub{position:absolute;top:430px;left:0;right:0;text-align:center;font:400 58px/1.3 'Instrument Sans',sans-serif;color:#6B6B70;padding:0 400px}
.shot{position:absolute;left:340px;top:575px;width:2200px;border-radius:26px;box-shadow:0 80px 160px -50px rgba(0,0,0,.45),0 0 0 2px rgba(0,0,0,.10)}
.shot img{display:block;width:100%;border-radius:26px}
.grid{position:absolute;left:380px;right:380px;top:660px;display:grid;grid-template-columns:repeat(4,1fr);gap:44px}.chip{height:300px;border-radius:44px;background:#fff;border:2px solid #E2E2DE;display:grid;place-items:center;font:800 68px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;text-align:center;padding:0 30px;box-shadow:0 30px 60px -40px rgba(0,0,0,.25)}</style><body><div class=eyebrow><span class=brand><span class="mark"><svg viewBox="0 0 24 24"><path d="M4 4l6 6M10 5v5H5M20 4l-6 6M14 5v5h5M4 20l6-6M10 19v-5H5M20 20l-6-6M14 19v-5h5"/></svg></span>Squeezo</span></div><h1>One app. Every tool.</h1><p class=sub>Compress, resize, crop, convert, merge, split and more, all offline.</p><div class=grid><div class=chip>Compress</div><div class=chip>Resize</div><div class=chip>Crop</div><div class=chip>Rotate &amp; Flip</div><div class=chip>Enlarge</div><div class=chip>Watermark</div><div class=chip>Hide Faces</div><div class=chip>Remove Background</div><div class=chip>Convert</div><div class=chip>Text &amp; Markdown</div><div class=chip>Merge PDFs</div><div class=chip>Split PDF</div></div></body>
